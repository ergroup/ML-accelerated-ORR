name: Sync ORR from isocan

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh repo sync ergroup/ML-accelerated-ORR --branch main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
